<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rajan Kumar | Premium Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-black text-white overflow-hidden">

    <audio id="audioIntro" preload="auto" src="sounds/intro.mp3"></audio>
    <audio id="audioClick" preload="auto" src="sounds/click.wav"></audio>
    <audio id="audioPop" preload="auto" src="sounds/pop-click.wav"></audio>

    <main class="min-h-screen relative">
        <div class="fx-bg">
            <div class="fx-orb fx-orb--blue"></div>
            <div class="fx-orb fx-orb--purple"></div>
            <div class="fx-orb fx-orb--cyan"></div>
            <div class="fx-grid"></div>
            <div class="fx-noise"></div>
        </div>

        <section id="screen-welcome" class="screen screen--active min-h-screen flex items-center justify-center">
            <div class="text-center relative px-6">
                <div class="welcome-title text-5xl md:text-7xl font-extrabold tracking-[0.3em] uppercase">
                    Welcome
                </div>
            </div>
        </section>

        <section id="screen-intro" class="screen min-h-screen flex items-center justify-center px-6">
            <div class="w-full max-w-4xl">
                <div class="intro-panel backdrop-blur-md">
                    <div class="flex justify-between items-center mb-6">
                        <div class="text-xs text-blue-400 font-mono tracking-widest">SYSTEM_INITIALIZED</div>
                        <button id="btn-skip" class="neon-btn px-4 py-1 rounded-md text-sm">Skip</button>
                    </div>
                    <h1 class="text-4xl md:text-6xl font-bold min-h-[80px]">
                        <span id="typingText"></span><span class="typing-caret"></span>
                    </h1>
                    <div class="mt-10">
                        <button id="btn-view-work" class="neon-btn px-8 py-3 rounded-xl font-bold">View My Work</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-home" class="screen min-h-screen px-6 py-16 overflow-y-auto">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-4xl font-bold mb-10 border-l-4 border-blue-500 pl-4">My Projects</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="work-card group" data-sound="pop">
                        <h3 class="text-xl font-bold text-blue-400">JanSetu AI</h3>
                        <p class="text-sm text-gray-400 mt-2">Public Safety & UI/UX App</p>
                    </div>
                    <div class="work-card group" data-sound="pop">
                        <h3 class="text-xl font-bold text-purple-400">CorelDRAW</h3>
                        <p class="text-sm text-gray-400 mt-2">Premium Print Media</p>
                    </div>
                    <div class="work-card group" data-sound="pop">
                        <h3 class="text-xl font-bold text-cyan-400">Photoshop</h3>
                        <p class="text-sm text-gray-400 mt-2">Digital Manipulation</p>
                    </div>
                    <div class="work-card work-card--soon">Video Editing (Soon)</div>
                    <div class="work-card work-card--soon">Motion Graphics (Soon)</div>
                    <div class="work-card work-card--soon">3D Animation (Soon)</div>
                </div>
            </div>
        </section>
    </main>

    <div id="modal" class="modal hidden backdrop-blur-xl">
        <button id="modalClose" class="absolute top-10 right-10 neon-btn px-4 py-2 rounded">Close</button>
        <img id="modalImg" src="" alt="Work Detail" />
    </div>

    <script src="script.js"></script>
</body>
</html>
